<meta charset="utf-8">
<title>{{PAGE_TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one long book axis scaled by word count; lanes stacked under a tension spine; detail below in two columns. */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --sunken: #eceef3; --band: rgba(40, 52, 80, .045);
  --fg: #151a24; --muted: #5b6474; --faint: #8a93a3; --line: #d9dde6; --focus: #2856d8;
  --accent: #2856d8; --accent-soft: rgba(40, 86, 216, .10);
  --ok: #18865a; --warn: #b26b00; --problem: #cc2f2a; --problem-soft: rgba(204, 47, 42, .12);
  --pos: #18865a; --neg: #cc2f2a;
  --heat1: rgba(204, 47, 42, .14); --heat2: rgba(204, 47, 42, .36); --heat3: rgba(204, 47, 42, .62); --heat4: rgba(204, 47, 42, .88);
  --fw-structure: #1f63d6; --fw-arcs: #c2410c; --fw-promises: #0f8a5f; --fw-mice: #8239c9;
  --fw-pacing: #3a4659; --fw-genre: #be2577; --fw-theme: #0d7891; --fw-opposition: #86651a;
  --fw-x1: #5f6b0e; --fw-x2: #a3304f; --fw-x3: #2f6f6f; --fw-x4: #6a4fb0;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1117; --surface: #161a22; --sunken: #1c212b; --band: rgba(170, 185, 220, .045);
  --fg: #e5e8ee; --muted: #9aa3b3; --faint: #6d7687; --line: #2a303c; --focus: #7d9cff;
  --accent: #7d9cff; --accent-soft: rgba(125, 156, 255, .14);
  --ok: #3fc98c; --warn: #e8a33c; --problem: #f0645c; --problem-soft: rgba(240, 100, 92, .16);
  --pos: #3fc98c; --neg: #f0645c;
  --heat1: rgba(240, 100, 92, .16); --heat2: rgba(240, 100, 92, .38); --heat3: rgba(240, 100, 92, .62); --heat4: rgba(240, 100, 92, .88);
  --fw-structure: #6ea2ff; --fw-arcs: #f28a4c; --fw-promises: #3fcf92; --fw-mice: #b88cf2;
  --fw-pacing: #c3ccda; --fw-genre: #f27ab6; --fw-theme: #4cc4dd; --fw-opposition: #d6b35c;
  --fw-x1: #b9c65a; --fw-x2: #f07f9c; --fw-x3: #6cc2c2; --fw-x4: #a990f0;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e1117; --surface: #161a22; --sunken: #1c212b; --band: rgba(170, 185, 220, .045);
  --fg: #e5e8ee; --muted: #9aa3b3; --faint: #6d7687; --line: #2a303c; --focus: #7d9cff;
  --accent: #7d9cff; --accent-soft: rgba(125, 156, 255, .14);
  --ok: #3fc98c; --warn: #e8a33c; --problem: #f0645c; --problem-soft: rgba(240, 100, 92, .16);
  --pos: #3fc98c; --neg: #f0645c;
  --heat1: rgba(240, 100, 92, .16); --heat2: rgba(240, 100, 92, .38); --heat3: rgba(240, 100, 92, .62); --heat4: rgba(240, 100, 92, .88);
  --fw-structure: #6ea2ff; --fw-arcs: #f28a4c; --fw-promises: #3fcf92; --fw-mice: #b88cf2;
  --fw-pacing: #c3ccda; --fw-genre: #f27ab6; --fw-theme: #4cc4dd; --fw-opposition: #d6b35c;
  --fw-x1: #b9c65a; --fw-x2: #f07f9c; --fw-x3: #6cc2c2; --fw-x4: #a990f0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1440px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: 28px; line-height: 1.15; }
h2 { font-size: 17px; }
h3 { font-size: 14px; }
.eyebrow { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header { display: grid; gap: 8px; }
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.title-row .vol { font-family: var(--font-display); font-size: 18px; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 12px var(--font-mono); color: var(--muted); }
.headline { font-size: 16px; line-height: 1.55; max-width: 72ch; margin: 2px 0 0; }
.sample { border: 1px dashed var(--warn); color: var(--warn); border-radius: var(--radius); padding: 6px 10px; font-size: 13px; justify-self: start; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500;
}
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.grade { font: 500 10px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; opacity: .75; }

.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: grid; }
.stage-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 14px 4px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 3px 9px; font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--sunken); color: var(--fg); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 2px 14px 10px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
.scroller { overflow-x: auto; position: relative; padding-bottom: 6px; }
svg#map { display: block; font-family: var(--font-body); }
svg#map text { fill: var(--fg); }
svg#map .t-muted { fill: var(--muted); }
svg#map .t-faint { fill: var(--faint); }
svg#map .lane-label { cursor: pointer; }
svg#map [data-tip], svg#map [data-finding] { cursor: pointer; }

.tip {
  position: fixed; z-index: 20; pointer-events: none; max-width: 320px; background: var(--fg); color: var(--bg);
  border-radius: 6px; padding: 7px 10px; font-size: 12px; line-height: 1.4; box-shadow: 0 6px 24px rgba(0,0,0,.18);
}
.tip b { font-weight: 600; }
.tip .tmono { font-family: var(--font-mono); opacity: .8; }
.tip { width: max-content; max-width: min(320px, calc(100vw - 16px)); }
.tip.wide { width: min(380px, calc(100vw - 16px)); max-width: none; max-height: calc(100vh - 16px); overflow: auto; padding: 10px 12px; display: grid; gap: 7px; }
.tt-title { font-weight: 600; font-size: 13px; }
.tt-row { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: start; }
.tt-num { font: 600 16px/1.1 var(--font-mono); text-align: center; border: 1px solid currentColor; border-radius: 4px; padding: 2px 0; opacity: .9; }
.tt-why { display: block; opacity: .75; margin-top: 2px; }
.tt-scene { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 12px; }
.tt-sgn { font: 600 12px/1.4 var(--font-mono); text-align: center; border-radius: 3px; }
.tt-sgn.up { background: color-mix(in srgb, var(--pos) 35%, transparent); }
.tt-sgn.down { background: color-mix(in srgb, var(--neg) 35%, transparent); }
.tt-sgn.flat { outline: 1px dashed currentColor; opacity: .7; }
.tt-gap { border-top: 1px solid color-mix(in srgb, currentColor 25%, transparent); padding-top: 6px; }
.tt-ref { font-size: 12px; }
.tt-foot { font-size: 11px; opacity: .6; border-top: 1px solid color-mix(in srgb, currentColor 25%, transparent); padding-top: 6px; }

.detail { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .detail { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

#about:empty { display: none; }
#about { padding: 2px 14px 8px; }
.about { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; background: var(--sunken); }
.about summary { cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; list-style-position: outside; }
.about summary .by { font-size: 12px; color: var(--muted); font-style: italic; }
.about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 22px; margin-top: 10px; }
.about-grid h3 { font-size: 13px; margin-bottom: 4px; }
.about-grid ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }
.verdict { display: grid; gap: 6px; padding: 10px 12px; background: var(--sunken); border-radius: var(--radius); }
.verdict p { margin: 0; max-width: 70ch; }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 500 11px/1 var(--font-mono); padding: 3px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.high { color: var(--problem); border-color: var(--problem); }
.chip.medium { color: var(--muted); }
.chip.g-strong { color: var(--ok); border-color: var(--ok); }
.chip.g-mixed { color: var(--warn); border-color: var(--warn); }
.chip.g-weak { color: var(--problem); border-color: var(--problem); }

.items { display: grid; }
.item { border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item > button {
  width: 100%; text-align: left; background: none; border: 0; padding: 10px 2px;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center;
}
.item > button:hover { background: var(--sunken); }
.item .id { font: 500 12px var(--font-mono); padding: 2px 6px; border-radius: 4px; color: #fff; }
.item .ttl { font-weight: 500; }
.item .sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
.item .right { display: flex; gap: 6px; align-items: center; }
.item.selected > button { background: var(--accent-soft); }
.body { padding: 4px 2px 14px; display: grid; gap: 10px; }
.body p { margin: 0; max-width: 70ch; }
.body ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.label { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
blockquote {
  margin: 0; padding: 8px 10px; background: var(--sunken); border-radius: var(--radius); font-size: 13px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: start;
}
blockquote .ref { font: 12px var(--font-mono); color: var(--muted); grid-column: 1; }
.copy { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; font-size: 11px; padding: 2px 7px; grid-row: span 2; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.fw-dots { display: inline-flex; gap: 3px; }
.rank { font: 600 13px var(--font-mono); color: var(--muted); width: 22px; text-align: right; }

.glance { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; text-align: left; background: var(--surface); }
.card:hover { border-color: var(--muted); }
.card p { margin: 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }

.ch-sec { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.ch-sec:first-of-type { border-top: 0; padding-top: 0; }
.ch-sec h3 { display: flex; align-items: center; gap: 8px; }
.ch-line { font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
.ch-line .k { font: 11px var(--font-mono); color: var(--muted); min-width: 66px; flex: none; }
.st { font: 500 10px/1 var(--font-mono); text-transform: uppercase; padding: 2px 4px; border-radius: 3px; flex: none; }
.st.ok { color: var(--ok); } .st.warn { color: var(--warn); } .st.problem, .st.missing { color: var(--problem); }
.empty { color: var(--muted); font-size: 13px; }
.err { padding: 24px; border: 1px dashed var(--problem); border-radius: 8px; color: var(--problem); }
@media (prefers-reduced-motion: no-preference) { .item .body { animation: open .16s ease-out; } @keyframes open { from { opacity: .4; } to { opacity: 1; } } }

/* bottom area: focus (left) + side (right) */
.detail { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
.focus, .side { position: sticky; top: calc(var(--strip-h, 0px) + 12px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - var(--strip-h, 0px) - 24px - env(safe-area-inset-top, 0px)); }
.stage-head { position: relative; }
.info { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font: 600 12px var(--font-mono); color: var(--muted); padding: 0; }
.info:hover, .info[aria-expanded="true"] { color: var(--fg); border-color: var(--muted); }
.pop { position: absolute; right: 14px; top: calc(100% - 2px); z-index: 12; width: min(430px, 90vw); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 40px rgba(15, 20, 35, .18); padding: 12px 14px; display: grid; gap: 8px; font-size: 13px; color: var(--fg); text-align: left; }
.pop p { margin: 0; }
.pop ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.pop-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pop-note { color: var(--warn); font-size: 12px; }
.scale { border-collapse: collapse; font-size: 12px; }
.scale td { padding: 3px 8px 3px 0; border-top: 1px solid var(--line); vertical-align: top; }
.scale td.mono { color: var(--muted); white-space: nowrap; }
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: 0 6px 18px rgba(20, 26, 40, .06); }
.strip-ch { display: grid; gap: 4px; min-width: 0; align-content: start; }
.strip-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.strip-name { font: 600 15px/1.3 var(--font-display); }
.strip-meta { font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.strip-sum { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.strip-chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.strip-chips .label { margin-right: 4px; }
.mini-chip { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 1px 6px; font: 500 11px var(--font-mono); }
.mini-chip:hover { border-color: var(--muted); }
.mini-chip.on { border-color: var(--accent); background: var(--accent-soft); }
.mini-chip.fix { border-color: var(--problem); color: var(--problem); font-weight: 600; }
.fixin { color: var(--problem); font-weight: 500; }
.strip-v { border-left: 1px solid var(--line); padding-left: 16px; display: grid; gap: 3px; align-content: start; min-width: 0; }
.strip-v .kicker { margin-bottom: 0; }
.strip-v p { margin: 0; font-size: 13px; }
.strip-v .more p { max-height: 30vh; overflow: auto; }
.x.sm { width: 22px; height: 22px; font-size: 14px; margin-left: auto; }
.ch-line.run { color: var(--muted); }
.ch-line .rel { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 2px; font-size: 12px; }
.turns { display: grid; gap: 6px; padding: 10px 12px; background: var(--sunken); border-radius: var(--radius); }
.turns .label { margin-bottom: 2px; }
.turn-net, .turn { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 13px; }
.turn-net .tt-num { border-color: var(--muted); }
.turns .note { display: block; color: var(--muted); font-size: 12px; }
.side-head .seg { flex-wrap: wrap; }
.focus { overflow: auto; align-content: start; }
.side { display: flex; flex-direction: column; padding: 0; gap: 0; overflow: hidden; }
.side-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.side-tools { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.side-body { overflow: auto; padding: 8px 14px 16px; position: relative; flex: 1; min-height: 0; }
.side-note { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
select { font: inherit; font-size: 12px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
.pick, .check { display: inline-flex; gap: 6px; align-items: center; }
.id { font: 500 12px var(--font-mono); padding: 2px 6px; border-radius: 4px; color: #fff; white-space: nowrap; }
.ttl { font-weight: 500; }
.sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.rows { display: grid; }
.row { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 9px 4px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.rows > .row:first-child { border-top: 0; }
.row:hover { background: var(--sunken); }
.row.on { background: var(--accent-soft); }
.row-main { display: grid; gap: 1px; min-width: 0; }
.cnt { font: 600 13px var(--font-mono); min-width: 22px; text-align: center; color: var(--problem); }
.chip.warn-chip { color: var(--warn); border-color: var(--warn); }
.chip.s-fixed { color: var(--ok); border-color: var(--ok); }
.chip.s-partly { color: var(--warn); border-color: var(--warn); }
.chip.s-kept, .chip.s-stale { color: var(--muted); border-style: dashed; }
.chip.s-reopened { color: var(--problem); border-color: var(--problem); }
.row.closed, .tl-e.closed { opacity: .6; }
.row .right { display: flex; gap: 6px; align-items: center; }
.status-box { display: grid; gap: 6px; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line); }
.status-box.s-fixed { border-color: var(--ok); }
.status-box.s-partly { border-color: var(--warn); }
.status-box.s-reopened { border-color: var(--problem); }
.status-box p { margin: 0; font-size: 13px; }

.focus-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.focus-head h2 { font-size: 19px; line-height: 1.3; }
.kicker { font: 500 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.x { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 28px; height: 28px; font-size: 17px; line-height: 1; flex: none; color: var(--muted); }
.x:hover { color: var(--fg); border-color: var(--muted); }
.lede { font-size: 16px; line-height: 1.5; margin: 0; max-width: 64ch; }
.lede.sm { font-size: 14.5px; }
.sugg { margin: 0; max-width: 64ch; }
.why { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 3px; }
.ev { display: grid; gap: 6px; }
.ev .label { margin-bottom: 0; }
.label + ul, .label + .rows, .label + p { margin-top: 6px; }
.more summary, .others summary { cursor: pointer; font-size: 12px; color: var(--accent); }
.more p { margin: 8px 0 0; font-size: 13px; color: var(--muted); max-width: 64ch; }
.others { border-top: 1px solid var(--line); padding-top: 10px; }
.others[open] > summary { margin-bottom: 10px; }
.others .ch-sec { margin-top: 10px; }
.ch-line .note { display: block; color: var(--muted); font-size: 12px; }
.pathline { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.also { display: grid; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); }
.also .row { border-top: 0; padding: 4px 2px; }
.note-box { margin: 0; font-size: 13px; color: var(--warn); border: 1px dashed var(--warn); border-radius: var(--radius); padding: 8px 10px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.mini { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 6px 2px; background: var(--surface); }

.tl { display: grid; }

.tl-act .mono { font-weight: 400; font-size: 11px; }

.tl-ch.on { background: var(--accent-soft); border-left-color: var(--accent); }

.tl-head { background: none; border: 0; padding: 0 0 3px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; }

.tl-e { width: 100%; background: none; border: 0; text-align: left; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; gap: 8px; align-items: start; padding: 3px 4px; border-radius: 4px; font-size: 13px; }
.tl-e:hover { background: var(--sunken); }

.ex { display: grid; gap: 14px; padding-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.fchip.off { opacity: .45; text-decoration: line-through; }
.ex-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pairs-wrap { overflow-x: auto; }
.pairs { border-collapse: separate; border-spacing: 2px; font-size: 12px; }
.pairs th { font-weight: 500; text-align: left; padding: 0 8px 0 0; white-space: nowrap; }
.pairs th.ph { text-align: center; padding: 0; }
.pairs button { width: 34px; height: 24px; border: 0; border-radius: 4px; font: 500 11px var(--font-mono); color: var(--fg); }
.pairs .self { display: block; width: 34px; text-align: center; color: var(--faint); }
</style>

<div class="wrap" id="app"></div>
<div class="tip" id="tip" hidden></div>

<script id="data" type="application/json">/*ANALYSIS_JSON*/</script>
<script>
(function () {
  "use strict";
  const app = document.getElementById("app");
  let D;
  try { D = JSON.parse(document.getElementById("data").textContent); }
  catch (e) { app.innerHTML = '<div class="err">No analysis data. Build this page with <code>python scripts/story-frameworks.py build &lt;run&gt;</code>.</div>'; return; }

  // ---------- data prep ----------
  const CH = D.chapters;
  const IDX = Object.fromEntries(CH.map((c, i) => [c.id, i]));
  const TOTAL = CH.reduce((s, c) => s + c.words, 0);
  let acc = 0;
  CH.forEach(c => { c.w0 = acc; acc += c.words; c.w1 = acc; c.p0 = c.w0 / TOTAL; c.p1 = c.w1 / TOTAL; });
  const FW = D.frameworks;
  const FWK = Object.fromEntries(FW.map(f => [f.key, f]));
  const KNOWN = ["structure", "arcs", "promises", "mice", "pacing", "genre", "theme", "opposition"];
  let extra = 0;
  FW.forEach(f => { f.colorVar = KNOWN.includes(f.key) ? `--fw-${f.key}` : `--fw-x${(extra++ % 4) + 1}`; f.findings = f.findings || []; f.marks = f.marks || []; f.spans = f.spans || []; f.series = f.series || []; f.rows = f.rows || []; });
  const FINDING = {};
  FW.forEach(f => f.findings.forEach(x => { x.fw = f.key; FINDING[x.id] = x; }));
  const CONV = Object.fromEntries((D.convergence || []).map((c, k) => [c.id, { ...c, rank: k + 1 }]));
  // Issue status from the volume's status file: fixed, kept and stale are closed; partly and reopened stay open.
  const CLOSED_ST = ["fixed", "kept", "stale"];
  const isClosed = x => !!(x && x.state && CLOSED_ST.includes(x.state.status));
  const N_CLOSED = Object.values(FINDING).filter(isClosed).length + (D.convergence || []).filter(isClosed).length;
  let SPINE = null;
  FW.forEach(f => f.series.forEach(s => { if (s.spine && !SPINE) SPINE = { s, fw: f }; }));
  const TENSION = SPINE;
  // A conventional shape for commercial genre fiction, by share of words. Not a measured optimum:
  // the beat timing from Save the Cat, expressed as last-page tension ranges on the fixed scale.
  const REF_SHAPE = [
    [0.00, 2, 4, "Opening"], [0.07, 3, 5, "Setup"], [0.10, 5, 7, "Catalyst"], [0.15, 3, 5, "Debate"],
    [0.20, 5, 7, "Break into Two"], [0.28, 3, 5, "Fun and Games"], [0.35, 4, 6, "Fun and Games"], [0.43, 4, 6, "Fun and Games"],
    [0.50, 6, 8, "Midpoint"], [0.55, 4, 6, "Rest after the midpoint"], [0.65, 5, 7, "Bad Guys Close In"],
    [0.75, 7, 9, "All Is Lost"], [0.78, 4, 6, "Dark Night of the Soul"], [0.81, 6, 8, "Break into Three"],
    [0.88, 7, 9, "Finale"], [0.93, 8, 10, "Climax"], [0.975, 8, 10, "Climax"], [1.00, 2, 5, "Final image"],
  ];
  function refAt(p) {
    let i = REF_SHAPE.findIndex(r => r[0] >= p);
    if (i <= 0) return { lo: REF_SHAPE[0][1], hi: REF_SHAPE[0][2], label: REF_SHAPE[0][3] };
    const a = REF_SHAPE[i - 1], b = REF_SHAPE[i], t = (p - a[0]) / (b[0] - a[0] || 1);
    return { lo: a[1] + (b[1] - a[1]) * t, hi: a[2] + (b[2] - a[2]) * t, label: (t < .5 ? a : b)[3] };
  }
  const VSHIFT = FW.flatMap(f => f.series).find(x => x.label === "Value shift") || null;
  const TPEAK = TENSION ? TENSION.fw.series.find(x => x.overlay === "spine") : null;
  const overlayFor = () => (SPINE && TENSION && SPINE.s === TENSION.s ? TPEAK : null);
  const TEXT = { name: "the {{UNIT}} text", colorVar: "--accent", measured: true };
  const FLOWS = [];
  if (SPINE) FLOWS.push({ key: "spine", s: SPINE.s, fw: SPINE.fw });
  FW.forEach(f => f.series.forEach((s, k) => { if (!SPINE || s !== SPINE.s) FLOWS.push({ key: `${f.key}:${k}`, s, fw: f }); }));
  const measured = (label, field, type, unit, max) => {
    const values = {}; CH.forEach(c => { if (c[field] != null) values[c.id] = c[field]; });
    if (Object.keys(values).length) FLOWS.push({ key: "text:" + field, s: { label, type, unit, min: 0, max: max ?? Math.ceil(Math.max(...Object.values(values)) / 10) * 10, values }, fw: TEXT });
  };
  measured("Dialogue share", "dialogue", "line", "%", 100);
  measured("Sentence length", "sentence", "line", " words");
  measured("{{Unit}} length", "words", "bars", " words");
  const setFlow = key => { const fl = FLOWS.find(x => x.key === key) || FLOWS[0]; SPINE = fl ? { s: fl.s, fw: fl.fw, key: fl.key } : null; };
  setFlow("spine");

  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const col = f => `var(${f.colorVar})`;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const LABELS = (D.meta && D.meta.labels) || {};
  // Units with almost no text are placeholders (merged or stub chapters). Scenes in a script are short but real.
  const PLACEHOLDER_WORDS = ["screenplay", "teleplay", "stage play"].includes(D.meta && D.meta.form) ? 8 : 40;
  const chName = id => { const c = CH[IDX[id]]; if (!c) return id; return LABELS[id] || "{{UNIT_SHORT}} " + id.replace(/^0+(?=\d)/, ""); };
  const pct = p => (p * 100).toFixed(p < 0.1 ? 1 : 0) + "%";
  function ranges(ids) {
    const ix = [...new Set(ids)].map(i => IDX[i]).filter(i => i != null).sort((a, b) => a - b);
    const out = []; let s = null, prev = null;
    ix.forEach(i => { if (s === null) { s = prev = i; } else if (i === prev + 1) { prev = i; } else { out.push([s, prev]); s = prev = i; } });
    if (s !== null) out.push([s, prev]);
    return out.map(([a, b]) => a === b ? chName(CH[a].id) : `${chName(CH[a].id)}–${CH[b].id.replace(/^0+(?=\d)/, "")}`).join(", ");
  }

  // ---------- state ----------
  const state = {
    view: "all",
    hidden: new Set(),
    sev: "all",
    chapter: null,
    finding: null,
    sel: null,
    hl: [],
    stripCh: null,
    sideAll: "agree",
    sideFw: "timeline",
    tlfw: FW[0] ? FW[0].key : "",
    prfw: "",
    minor: false,
    agreeMin: 2,
    flowInfo: false,
    ref: true,
    closed: false,
  };
  const vis = x => state.closed || !isClosed(x);
  // #ch-24 opens a {{UNIT}} on All frameworks; #pacing-ch-24 opens it on a framework tab; #pacing opens a tab.
  function parseHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    const m = /^(?:([a-z]+)-)?ch-(\d+(?:-\d+)?)$/.exec(h);
    if (m) return { view: FWK[m[1]] ? m[1] : "all", ch: m[2].replace("-", ".") };
    return { view: FWK[h] ? h : "all", ch: null };
  }
  function fromHash() { const p = parseHash(); state.view = p.view; return p.ch; }
  fromHash();
  window.addEventListener("hashchange", () => {
    const before = state.view, ch = fromHash();
    if (ch && IDX[ch] != null) { setSel({ t: "chapter", id: ch }); renderAll(); scrollSideTo(state.sel); return; }
    if (state.view !== before) { if (!state.sel || state.sel.t !== "chapter") setSel(defaultSel()); renderAll(); }
  });
  function go(view) {
    state.view = FWK[view] ? view : "all";
    if (!state.sel || state.sel.t !== "chapter") setSel(defaultSel());
    renderAll();
    try { if (location.protocol !== "data:" && location.protocol !== "file:") history.replaceState(null, "", "#" + state.view); } catch (_) {}
  }

  // ---------- shell ----------
  const m = D.meta || {};
  app.innerHTML = `
    <header>
      <div class="eyebrow">Structure Explorer</div>
      <div class="title-row"><h1>${esc(m.title || "Untitled")}</h1><span class="vol">${esc(m.volume || "")}</span></div>
      <div class="meta">
        <span>${CH.length} {{UNITS}}</span><span>${TOTAL.toLocaleString()} words</span>
        <span>${FW.length} frameworks</span><span>run ${esc(m.run || "")}</span>
        <span>git ${esc(m.git || "")}${m.dirty ? " (uncommitted changes)" : ""}</span>
        ${N_CLOSED ? `<span>${N_CLOSED} closed</span>` : ""}
        ${(D.confirmed || []).length ? `<span title="${esc(D.confirmed.map(e => e.id + " " + e.title).join("; "))}">${D.confirmed.length} earlier fixes confirmed by this run</span>` : ""}
      </div>
      ${m.sample ? '<div class="sample">Sample data. Findings here are placeholders, not an analysis of the {{WORK}}.</div>' : ""}
      ${D.headline ? `<p class="headline">${esc(D.headline)}</p>` : ""}
    </header>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <section class="stage">
      <div class="stage-head"><h2 id="stage-title"></h2><div class="controls" id="controls"></div></div>
      <div id="about"></div>
      <div class="legend" id="legend"></div>
      <div class="scroller" id="scroller"><svg id="map" role="img" aria-label="Book structure diagram"></svg></div>
    </section>
    <section class="strip" id="strip" aria-live="polite"></section>
    <div class="detail">
      <aside class="panel side" id="side"></aside>
      <section class="panel focus" id="focus"></section>
    </div>`;
  const $ = id => document.getElementById(id);
  const svg = $("map"), tip = $("tip"), scroller = $("scroller");

  function renderTabs() {
    const tabs = [`<button class="tab" role="tab" data-view="all" aria-selected="${state.view === "all"}">All frameworks</button>`]
      .concat(FW.map(f => `<button class="tab" role="tab" data-view="${esc(f.key)}" aria-selected="${state.view === f.key}">
        <span class="dot" style="background:${col(f)}"></span>${esc(f.name)}<span class="grade">${esc(f.grade || "")}</span></button>`));
    $("tabs").innerHTML = tabs.join("");
  }
  $("tabs").addEventListener("click", e => {
    const b = e.target.closest("[data-view]"); if (!b) return;
    go(b.dataset.view);
  });

  function renderAbout() {
    const ab = state.view !== "all" && ABOUT[state.view];
    $("about").innerHTML = ab ? `<details class="about" ${state.about ? "open" : ""}>
      <summary><span class="label">About this framework</span><span class="by">${esc(ab.by)}</span></summary>
      <div class="about-grid">
        <div><h3>What it looks for</h3><ul>${ab.looks.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>
        <div><h3>How to read the map</h3><ul>${ab.read.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>
      </div>
    </details>` : "";
  }
  function flowControls() {
    if (!FLOWS.length) return "";
    const refToggle = overlayFor() ? `<label class="check"><input type="checkbox" id="ref-toggle" ${state.ref ? "checked" : ""}> Reference band</label>` : "";
    return refToggle + `<label class="pick">Top curve <select id="flow-pick" aria-label="Top curve">${FLOWS.map(fl => `<option value="${esc(fl.key)}" ${SPINE && fl.key === SPINE.key ? "selected" : ""}>${esc(fl.s.label)}${fl.fw.measured ? " (measured)" : ""}</option>`).join("")}</select></label>
      <button class="info" id="flow-info" aria-expanded="${state.flowInfo ? "true" : "false"}" title="What does this curve mean?">?</button>
      <div class="pop" id="flow-pop" ${state.flowInfo ? "" : "hidden"}>${flowInfoHTML()}</div>`;
  }
  function closedToggle() {
    return N_CLOSED ? `<label class="check"><input type="checkbox" id="closed-toggle" ${state.closed ? "checked" : ""}> Show closed (${N_CLOSED})</label>` : "";
  }
  function renderControls() {
    renderAbout();
    if (state.view === "all") {
      $("stage-title").textContent = "Where the frameworks flag the {{WORK}}";
      $("controls").innerHTML = `<span>Severity</span><span class="seg">
        <button data-sev="all" aria-pressed="${state.sev === "all"}">All</button>
        <button data-sev="high" aria-pressed="${state.sev === "high"}">High only</button></span>
        ${closedToggle()}${flowControls()}`;
      $("legend").innerHTML = `
        <span><i class="sw" style="background:var(${SPINE ? SPINE.fw.colorVar : "--muted"});opacity:.5"></i>${esc(SPINE ? SPINE.s.label : "")} (top curve)${overlayFor() ? ", dashed line = peak" : ""}</span>
        ${overlayFor() ? `<span><i class="sw" style="background:var(--ok);opacity:.25"></i>Reference band; amber and red ticks mark {{UNITS}} below or above it</span>` : ""}
        <span><i class="sw" style="background:var(--muted)"></i>High finding</span>
        <span><i class="sw" style="background:var(--muted);opacity:.4"></i>Medium finding</span>
        <span><i class="sw" style="background:var(--heat1)"></i><i class="sw" style="background:var(--heat2)"></i><i class="sw" style="background:var(--heat3)"></i><i class="sw" style="background:var(--heat4)"></i>Overlap: 1, 2, 3, 4+ frameworks</span>
        <span>Click a lane name to turn a framework off.</span>`;
    } else {
      const f = FWK[state.view];
      $("stage-title").innerHTML = `<span class="dot" style="background:${col(f)};margin-right:8px"></span>${esc(f.name)}${f.lens ? ` <span class="muted" style="font-weight:500">· ${esc(f.lens)}</span>` : ""}`;
      $("controls").innerHTML = closedToggle() + flowControls();
      $("legend").innerHTML = `
        <span><svg width="12" height="12"><path d="M6 1 11 6 6 11 1 6Z" fill="${col(f)}"/></svg>On track</span>
        <span><svg width="12" height="12"><path d="M6 1 11 6 6 11 1 6Z" fill="var(--warn)"/></svg>Off or thin</span>
        <span><svg width="12" height="12"><path d="M6 1 11 6 6 11 1 6Z" fill="var(--problem)"/></svg>Problem</span>
        <span><svg width="12" height="12"><circle cx="6" cy="6" r="4.2" fill="none" stroke="var(--problem)" stroke-dasharray="2 1.6" stroke-width="1.4"/></svg>Missing</span>
        <span><svg width="22" height="12"><circle cx="4" cy="6" r="3" fill="none" stroke="var(--muted)"/><line x1="7" y1="6" x2="19" y2="6" stroke="var(--muted)" stroke-dasharray="2 2"/></svg>Target position</span>
        <span><svg width="22" height="12"><rect x="1" y="2" width="20" height="8" rx="2" fill="${col(f)}" fill-opacity=".25" stroke="${col(f)}"/></svg>Span</span>
        <span><svg width="22" height="12"><rect x="1" y="2" width="20" height="8" rx="2" fill="url(#lg-fade)" stroke="none"/><defs><linearGradient id="lg-fade"><stop offset="0" stop-color="${css(f.colorVar)}" stop-opacity=".5"/><stop offset="1" stop-color="${css(f.colorVar)}" stop-opacity="0"/></linearGradient></defs></svg>Still open</span>`;
    }
  }
  $("controls").addEventListener("change", e => {
    if (e.target.id === "ref-toggle") { state.ref = e.target.checked; drawMap(); return; }
    if (e.target.id === "closed-toggle") { state.closed = e.target.checked; drawMap(); renderStrip(); renderSide(true); renderFocus(); return; }
    if (e.target.id !== "flow-pick") return;
    setFlow(e.target.value); renderControls(); drawMap(); renderFocus();
  });
  document.addEventListener("click", e => {
    if (!state.flowInfo || e.target.closest("#flow-pop, #flow-info")) return;
    state.flowInfo = false; const pop = $("flow-pop"); if (pop) pop.hidden = true; const b = $("flow-info"); if (b) b.setAttribute("aria-expanded", "false");
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && state.flowInfo) { state.flowInfo = false; renderControls(); } });
  $("controls").addEventListener("click", e => {
    if (e.target.closest("#flow-info")) { state.flowInfo = !state.flowInfo; renderControls(); return; }
    const b = e.target.closest("[data-sev]"); if (!b) return;
    state.sev = b.dataset.sev; renderControls(); drawMap(); renderSide(true); renderFocus();
  });

  // ---------- map ----------
  const GUT = 150, PAD_R = 14;
  let G = null; // geometry of last draw
  const sevOk = x => vis(x) && (state.sev === "all" || x.severity === "high");
  const visibleFW = () => FW.filter(f => !state.hidden.has(f.key));

  function pack(items) { // items: {a, b} {{UNIT}} index range; returns lane index per item
    const ends = [];
    const sorted = items.map((it, i) => ({ it, i })).sort((p, q) => p.it.a - q.it.a || q.it.b - p.it.b);
    const lane = new Array(items.length);
    sorted.forEach(({ it, i }) => {
      let l = ends.findIndex(e => e < it.a);
      if (l === -1) { l = ends.length; ends.push(it.b); } else ends[l] = it.b;
      lane[i] = l;
    });
    return { lane, count: Math.max(1, ends.length) };
  }

  function drawMap() {
    const width = Math.max(scroller.clientWidth, 900);
    const plotW = width - GUT - PAD_R;
    const X = w => GUT + (w / TOTAL) * plotW;
    const x0 = i => X(CH[i].w0), x1 = i => X(CH[i].w1), xm = i => (x0(i) + x1(i)) / 2;
    const parts = [], defs = [];
    let y = 0;
    const rows = [];

    // axis
    const axisH = 40;
    rows.push({ kind: "axis", y, h: axisH }); y += axisH;
    if (D.acts && D.acts.length) { rows.push({ kind: "acts", y, h: 22 }); y += 22; }
    if (SPINE) { rows.push({ kind: "spine", y, h: 96 }); y += 100; }

    if (state.view === "all") {
      FW.forEach(f => {
        const items = f.findings.filter(sevOk).map(x => {
          const ix = x.chapters.map(c => IDX[c]).filter(v => v != null);
          return { a: Math.min(...ix), b: Math.max(...ix), x, ix };
        }).filter(it => isFinite(it.a));
        const p = pack(items);
        const h = Math.max(30, p.count * 13 + 12);
        rows.push({ kind: "fwlane", f, items, pack: p, y, h }); y += h;
      });
      rows.push({ kind: "overlap", y: y + 6, h: 30 }); y += 40;
    } else {
      const f = FWK[state.view];
      f.series.filter(s => !(SPINE && s === SPINE.s) && !(s.overlay && SPINE && SPINE.s === TENSION?.s)).forEach(s => { rows.push({ kind: "series", f, s, y, h: 70 }); y += 76; });
      f.rows.forEach(r => {
        const spans = f.spans.filter(s => s.row === r).map(s => {
          const a = IDX[s.from], b = s.to == null ? CH.length - 1 : IDX[s.to];
          return { a, b, s };
        }).filter(it => it.a != null && it.b != null);
        const p = pack(spans);
        const marks = f.marks.filter(mk => mk.row === r && IDX[mk.chapter] != null);
        const lanes = spans.length ? p.count : 0;

    svg.setAttribute("width", width); svg.setAttribute("height", H);

  function chapterAt(px) {
    if (!G || px < GUT) return null;
    const w = (px - GUT) / G.plotW * TOTAL;
    const c = CH.find(c => w >= c.w0 && w < c.w1);

  }

    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + tw > innerWidth - 8) x = e.clientX - tw - pad;
    if (y + th > innerHeight - 8) y = e.clientY - th - pad;
    x = Math.min(Math.max(8, x), Math.max(8, innerWidth - tw - 8));
    y = Math.min(Math.max(8, y), Math.max(8, innerHeight - th - 8));
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }

    const fallback = () => { const ref = btn.parentElement.querySelector(".ref"); if (!ref) return; const r = document.createRange(); r.selectNodeContents(ref); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (_) { fallback(); }
  }
  const tipEvents = el => {
    el.addEventListener("mousemove", e => { const tc = e.target.closest("[data-tch]"); if (tc) { showTip(e, tensionTip(tc.dataset.tch), true); return; } const vc = e.target.closest("[data-vch]"); if (vc) { showTip(e, shiftTip(vc.dataset.vch), true); return; } const t = e.target.closest("[data-tip]"); if (t) { const [a, b] = t.getAttribute("data-tip").split("|"); showTip(e, `<b>${a}</b>${b ? `<br><span class="tmono">${b}</span>` : ""}`); } else tip.hidden = true; });
    el.addEventListener("mouseleave", () => { tip.hidden = true; });
  };

  // ---------- mini map ----------
  function miniMap(chapters, mode) {
    const ix = chapters.map(c => IDX[c]).filter(v => v != null);
    if (!ix.length) return "";
    const pad = mode.pad ?? 2;
    const lo = Math.max(0, Math.min(...ix) - pad), hi = Math.min(CH.length - 1, Math.max(...ix) + pad);
    const W = Math.max(320, ($("focus").clientWidth || 560) - 42), L = 6, R = 6;
    const w0 = CH[lo].w0, w1 = CH[hi].w1;
    const X = w => L + (w - w0) / (w1 - w0 || 1) * (W - L - R);
    const x0 = i => X(CH[i].w0), x1 = i => X(CH[i].w1), xm = i => (x0(i) + x1(i)) / 2;
    const set = new Set(ix), parts = [];
    let last = -99;
    for (let i = lo; i <= hi; i++) if (xm(i) - last >= 24) { last = xm(i); parts.push(`<text x="${xm(i)}" y="11" font-size="10" text-anchor="middle" class="mono ${set.has(i) ? "" : "t-muted"}" ${set.has(i) ? 'font-weight="600"' : ""}>${esc(CH[i].id.replace(/^0+(?=\d)/, ""))}</text>`); }
    let y = 18;
    if (SPINE) {
      const s = SPINE.s, a = s.min ?? Math.min(0, ...Object.values(s.values)), b = s.max ?? Math.max(...Object.values(s.values)), h = 54;
      const Y = v => y + h - 4 - ((v - a) / (b - a || 1)) * (h - 10);
      const pts = [];
      for (let i = lo; i <= hi; i++) { const v = s.values[CH[i].id]; if (v != null) pts.push([xm(i), Y(v), v, i]); }
      if (pts.length) {
        const d = pts.map((p, k) => (k ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
        const ov = overlayFor();
        if (ov) {
          const op = []; for (let i = lo; i <= hi; i++) { const v = ov.values[CH[i].id]; if (v != null) op.push([xm(i), Y(v)]); }
          if (op.length) parts.push(`<path d="${op.map((q, k) => (k ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join("")}" fill="none" stroke="${col(SPINE.fw)}" stroke-width="1.1" stroke-dasharray="4 3" stroke-opacity=".75"/>`);
        }
        parts.push(`<path d="${d}L${pts[pts.length - 1][0]} ${y + h}L${pts[0][0]} ${y + h}Z" fill="${col(SPINE.fw)}" fill-opacity=".1"/><path d="${d}" fill="none" stroke="${col(SPINE.fw)}" stroke-width="1.6"/>`);
        pts.forEach(p => { const tip2 = overlayFor() ? `data-tch="${esc(CH[p[3]].id)}"` : `data-tip="${esc(chName(CH[p[3]].id))}|${esc(s.label)} ${esc(p[2].toLocaleString())}${esc(s.unit || "")}"`; parts.push(`<circle cx="${p[0]}" cy="${p[1]}" r="${overlayFor() ? 3.2 : 2.4}" fill="${col(SPINE.fw)}" ${tip2}/>`); });
      }
      parts.push(`<text x="${L}" y="${y + 9}" font-size="9" class="t-faint mono">${esc(s.label.toUpperCase())}</text>`);
      y += h + 8;
    }
    if (mode.fw) {
      const f = mode.fw;
      const spans = f.spans.map(s => ({ s, a: IDX[s.from], b: s.to == null ? CH.length - 1 : IDX[s.to] }))
        .filter(it => it.a != null && it.b != null && it.b >= lo && it.a <= hi)
        .filter(it => mode.all || it.a >= lo || (it.s.to != null && it.b <= hi) || (it.s.status && it.s.status !== "ok"))
        .slice(0, mode.all ? 16 : 10)
        .map(it => ({ ...it, a: Math.max(it.a, lo), b: Math.min(it.b, hi) }));
      const p = pack(spans);
      spans.forEach((it, k) => {
        const ly = y + p.lane[k] * 17, xa = x0(it.a) + 1, ww = Math.max(3, x1(it.b) - 1 - xa), st = it.s.status || "ok", c = stColor(f, st);
        parts.push(`<rect x="${xa}" y="${ly}" width="${ww}" height="13" rx="3" fill="${c}" fill-opacity=".18" stroke="${c}" ${it.s.to == null ? 'stroke-dasharray="4 3"' : ""} data-tip="${esc(it.s.label)}|${esc(it.s.row)} · ${esc(chName(it.s.from))} to ${it.s.to == null ? "still open" : esc(chName(it.s.to))}"/>`);
        const fit = Math.floor((ww - 8) / 5.8), t = it.s.label || "";
        if (fit >= 4) parts.push(`<text x="${xa + 4}" y="${ly + 9.5}" font-size="9.5" pointer-events="none">${esc(t.length > fit ? t.slice(0, fit - 1) + "…" : t)}</text>`);
      });
      if (spans.length) y += p.count * 17 + 4;
      const marks = f.marks.filter(mk => { const i = IDX[mk.chapter]; return i != null && i >= lo && i <= hi; });
      if (marks.length) {
        let le = -1e9;
        marks.map(mk => ({ mk, x: xm(IDX[mk.chapter]) })).sort((a, b) => a.x - b.x).forEach(({ mk, x }) => {
          const st = mk.status || "ok", c = stColor(f, st);
          parts.push(`<path d="M${x} ${y}l6 6-6 6-6-6Z" fill="${st === "missing" ? "var(--surface)" : c}" stroke="${st === "missing" ? c : "var(--surface)"}" data-tip="${esc(mk.label)}|${esc(mk.row)} · ${esc(chName(mk.chapter))}${mk.note ? " · " + esc(mk.note) : ""}"/>`);
          const t = mk.label.length > 20 ? mk.label.slice(0, 19) + "…" : mk.label, tw = t.length * 5.3;
          if (x - tw / 2 > le + 4) { le = x + tw / 2; parts.push(`<text x="${x}" y="${y + 23}" font-size="9" text-anchor="middle" class="t-muted" pointer-events="none">${esc(t)}</text>`); }
        });
        y += 30;
      }
    }
    if (mode.findings) {
      const byFw = {};
      mode.findings.forEach(x => (byFw[x.fw] = byFw[x.fw] || []).push(x));
      FW.filter(f => byFw[f.key]).forEach(f => {
        const items = byFw[f.key].map(x => { const ii = x.chapters.map(c => IDX[c]).filter(v => v != null && v >= lo && v <= hi); return { x, ii, a: Math.min(...ii), b: Math.max(...ii) }; }).filter(it => isFinite(it.a));
        const p = pack(items);
        items.forEach((it, k) => {
          const ly = y + p.lane[k] * 15, on = state.finding === it.x.id;
          it.ii.forEach(i => parts.push(`<rect x="${x0(i) + .5}" y="${ly}" width="${Math.max(2, x1(i) - x0(i) - 1)}" height="11" rx="2" fill="${col(f)}" fill-opacity="${it.x.severity === "high" ? .85 : .4}" ${on ? 'stroke="var(--fg)" stroke-width="1.4"' : ""} data-sel-finding="${esc(it.x.id)}" data-tip="${esc(it.x.id + " · " + it.x.title)}|${esc(f.name)} · ${esc(it.x.severity)}"/>`));
          if (it.ii.length > 1) parts.push(`<line x1="${x0(it.a) + 1}" x2="${x1(it.b) - 1}" y1="${ly + 5.5}" y2="${ly + 5.5}" stroke="${col(f)}" stroke-opacity=".5" pointer-events="none"/>`);
          const lx = x1(it.b) + 3;
          if (lx < W - 22) parts.push(`<text x="${lx}" y="${ly + 9}" font-size="9" class="t-muted mono" pointer-events="none">${esc(it.x.id)}</text>`);
        });
        y += p.count * 15 + 5;
      });
    }
    const H = y + 2;
    const back = [...set].map(i => `<rect x="${x0(i)}" y="15" width="${Math.max(2, x1(i) - x0(i))}" height="${H - 15}" fill="var(--accent-soft)"/>`).join("");
    const grid = []; for (let i = lo; i <= hi + 1; i++) { const gx = i <= hi ? x0(i) : x1(hi); grid.push(`<line x1="${gx}" x2="${gx}" y1="15" y2="${H}" stroke="var(--line)" stroke-width=".6"/>`); }
    return `<div class="mini"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${back}${grid.join("")}${parts.join("")}</svg></div>`;
  }

  // ---------- strip: {{UNIT}} + verdict ----------
  function renderStrip() {
    const el = $("strip"), id = state.stripCh, c = id != null && IDX[id] != null ? CH[IDX[id]] : null;
    let chap;
    if (c) {
      const spine = TENSION && TENSION.s.values[id];
      const vs = FW.flatMap(f => f.series).find(s2 => s2.type === "bars" && s2.values[id] != null);
      const fws = state.view === "all" ? visibleFW() : [FWK[state.view]];
      const fs = fws.flatMap(f => f.findings.filter(x => vis(x) && x.chapters.includes(id)));
      chap = `<div class="strip-ch">
        <div class="strip-line"><span class="strip-name">${esc(chName(id))}${c.title === chName(id) ? "" : " · " + esc(c.title)}</span>
          <span class="strip-meta">${c.words.toLocaleString()} words · ${pct(c.p0)}–${pct(c.p1)}${c.pov ? " · POV " + esc(c.pov) : ""}${spine != null ? " · tension " + esc(spine) + (TPEAK && TPEAK.values[id] != null && TPEAK.values[id] !== spine ? ` (peak ${esc(TPEAK.values[id])})` : "") : ""}${vs ? ` · shift ${esc(fmtShift(vs.values[id]))}${zeroKind(id) === "cancel" ? " (ends where it started)" : zeroKind(id) === "none" ? " (nothing turned)" : ""}` : ""}</span>
          <button class="copy" data-copy="${esc(c.file)}">Copy path</button>
          <button class="x sm" data-clear-ch title="Clear chapter" aria-label="Clear chapter">×</button></div>
        ${c.summary ? `<div class="strip-sum" title="${esc(c.summary)}">${esc(c.summary)}</div>` : ""}
        ${fs.length ? `<div class="strip-chips"><span class="label">In findings</span>${fs.slice().sort((a, b) => ((b.fix_in || []).includes(id) - (a.fix_in || []).includes(id))).map(x => { const fx = (x.fix_in || []).includes(id); return `<button class="mini-chip${state.finding === x.id ? " on" : ""}${fx ? " fix" : ""}" data-sel-finding="${esc(x.id)}" title="${esc(x.title)}${fx ? " (fix here)" : x.fix_in && x.fix_in.length ? " (fix in " + esc(ranges(x.fix_in)) + ")" : ""}"><span class="dot" style="background:${col(FWK[x.fw])}"></span>${esc(x.id)}${fx ? " · fix here" : ""}</button>`; }).join("")}</div>` : ""}
      </div>`;
    } else chap = `<div class="strip-ch"><div class="strip-line"><span class="strip-name muted">No {{UNIT}} selected</span><span class="strip-meta">Click a {{UNIT}} on the map or in the timeline.</span></div></div>`;
    let v;
    if (state.view === "all") {
      const all = FW.flatMap(f => f.findings).filter(x => !isClosed(x)), hi = all.filter(x => x.severity === "high").length;
      const nc = FW.flatMap(f => f.findings).filter(isClosed).length;
      v = `<div class="strip-v"><div class="kicker">All frameworks</div><p>${FW.length} frameworks · ${all.length} open findings, ${hi} high${nc ? ` · ${nc} closed` : ""} · ${(D.convergence || []).filter(c => !isClosed(c)).length} places they agree</p></div>`;
    } else {
      const f = FWK[state.view], sv = shortVerdict(f);
      v = `<div class="strip-v"><div class="kicker">Verdict <span class="chip g-${esc(f.grade)}">${esc(f.grade || "")}</span></div><p>${esc(sv)}</p>${f.verdict && f.verdict !== sv ? `<details class="more"><summary>Full verdict</summary><p>${esc(f.verdict)}</p></details>` : ""}</div>`;
    }
    el.innerHTML = chap + v;
    stripHeight();
  }
  function stripHeight() { document.documentElement.style.setProperty("--strip-h", $("strip").offsetHeight + "px"); }
  $("strip").addEventListener("toggle", stripHeight, true);
  $("strip").addEventListener("click", e => {
    const t = e.target.closest("[data-copy],[data-sel-finding],[data-clear-ch]"); if (!t) return;
    const d = t.dataset;
    if (d.copy) return copy(t);
    if (d.selFinding) return select({ t: "finding", id: d.selFinding });
    if ("clearCh" in d) { state.stripCh = null; select(defaultSel()); }
  });

  // ---------- right: details ----------
  function chapterLines(f, id) {
    const lines = [], running = [];
    f.marks.filter(mk => mk.chapter === id).forEach(mk => lines.push(`<div class="ch-line"><span class="k">${esc(mk.row)}</span><span>${DIAMOND(stColor(f, mk.status || "ok"), mk.status === "missing")} ${esc(mk.label)}${mk.status && mk.status !== "ok" ? ` <span class="st ${esc(mk.status)}">${esc(mk.status)}</span>` : ""}${mk.note ? `<span class="note">${esc(mk.note)}</span>` : ""}${relatedLinks(f, mk)}</span></div>`));
    f.spans.forEach(s2 => {
      const a = IDX[s2.from], b = s2.to == null ? CH.length - 1 : IDX[s2.to], i = IDX[id];
      if (a == null || b == null || i < a || i > b) return;
      const where = s2.from === id ? "opens here" : s2.to === id ? "closes here" : "running";
      const flagged = s2.status && s2.status !== "ok";
      const showNote = s2.note && (flagged || where !== "running");
      const line = `<div class="ch-line${where === "running" && !flagged ? " run" : ""}"><span class="k">${esc(s2.row)}</span><span>${esc(s2.label)} <span class="muted">· ${where}</span>${flagged ? ` <span class="st ${esc(s2.status)}">${esc(s2.status)}</span>` : ""}${showNote ? `<span class="note">${esc(s2.note)}</span>` : ""}${relatedLinks(f, s2)}</span></div>`;
      (where === "running" ? running : lines).push(line);
    });
    return lines.concat(running);
  }
  const X_BTN = "";

  // The finding that explains a flagged span or mark: named in the data, or the
  // same framework's flagged finding that covers it.
  function relatedFor(f, item) {
    if (!item || !item.status || item.status === "ok") return [];
    if (item.finding) return [].concat(item.finding).map(id => FINDING[id]).filter(Boolean);
    let a, b;
    if (item.chapter != null) { a = b = IDX[item.chapter]; }
    else { a = IDX[item.from]; b = item.to == null ? CH.length - 1 : IDX[item.to]; }
    if (a == null || b == null) return [];
    const need = Math.min(2, b - a + 1);
    return f.findings.filter(x => x.chapters.filter(c => IDX[c] >= a && IDX[c] <= b).length >= need).slice(0, 2);
  }
  function relatedLinks(f, item) {
    const xs = relatedFor(f, item);
    return xs.length ? `<span class="rel">${xs.map(x => `<button class="linkish" data-sel-finding="${esc(x.id)}">${esc(x.id)} ${esc(x.title)} →</button>`).join("")}</span>` : "";
  }
  function turnsHTML(id) {
    if (!VSHIFT || VSHIFT.values[id] == null) return "";
    const c = CH[IDX[id]], v = VSHIFT.values[id], sc = c.scenes || [];
    const k = zeroKind(id);
    return `<div class="turns"><div class="label">Turns in this chapter</div>
      <div class="turn-net"><span class="tt-num">${fmtShift(v)}</span><span><b>${esc(shiftWord(v))}</b>${k === "cancel" ? `<span class="note">Ends where it started: the scenes cancel out.</span>` : k === "none" ? `<span class="note">Nothing turned.</span>` : ""}</span></div>
      ${sc.map(x => `<div class="turn"><span class="tt-sgn ${x.shift > 0 ? "up" : x.shift < 0 ? "down" : "flat"}">${fmtShift(x.shift || 0)}</span><span><i>${esc(x.value || "")}</i> · ${esc(x.turn || "")}${x.goal ? `<span class="note">Wanted: ${esc(x.goal)}</span>` : ""}</span></div>`).join("")}
    </div>`;
  }

  function focusChapter(id) {
    const c = CH[IDX[id]];
    const fws = state.view === "all" ? visibleFW() : [FWK[state.view]];
    const map = state.view === "all"
      ? miniMap([id], { findings: fws.flatMap(f => f.findings.filter(sevOk)), pad: 3 })
      : miniMap([id], { fw: FWK[state.view], all: true, pad: 3 });
    const secs = fws.map(f => {
      const ls = chapterLines(f, id);
      return ls.length ? `<div class="ch-sec">${fws.length > 1 ? `<h3><span class="dot" style="background:${col(f)}"></span>${esc(f.name)}</h3>` : ""}${ls.join("")}</div>` : "";
    }).filter(Boolean).join("");
    const turns = (state.view === "all" || state.view === "pacing") ? turnsHTML(id) : "";
    return `<div class="focus-head"><div><div class="kicker">Around this chapter</div><h2>${esc(chName(id))}${c.title === chName(id) ? "" : " · " + esc(c.title)}</h2></div></div>
      ${map}
      ${turns}
      ${secs ? `<div><div class="label">In play here</div>${secs}</div>` : `<p class="empty">Nothing from this framework in this {{UNIT}}.</p>`}`;
  }

  function focusFinding(x) {
    const f = FWK[x.fw];
    const convs = (D.convergence || []).filter(c => (c.findings || []).includes(x.id));
    const others = FW.filter(o => o.key !== x.fw).flatMap(o => o.findings.filter(y => y.chapters.some(c => x.chapters.includes(c))));
    return `<div class="focus-head"><div><div class="kicker"><span class="dot" style="background:${col(f)}"></span>${esc(f.name)} finding</div>
        <h2>${idChip(x)} ${esc(x.title)}</h2></div>${X_BTN}</div>
      <div class="meta"><span>${esc(ranges(x.chapters))}</span>${x.fix_in && x.fix_in.length ? `<span class="fixin">Fix in ${esc(ranges(x.fix_in))}</span>` : ""}${sevChip(x)}${stChip(x)}${state.view !== x.fw ? `<button class="linkish" data-go="${esc(x.fw)}">Open the ${esc(f.name)} tab</button>` : ""}</div>
      ${miniMap(x.chapters, { fw: f })}
      ${statusBox(x)}
      <p class="lede sm">${esc(x.problem)}</p>
      ${convs.length || others.length ? `<div class="also">
        ${convs.map(c => `<button class="row" data-sel-conv="${esc(c.id)}"><span class="rank">${CONV[c.id].rank}</span><span class="row-main"><span class="ttl">${esc(c.title)}</span><span class="sub">Where they agree</span></span>${fwDots([...new Set((c.findings || []).map(id => FINDING[id]?.fw).filter(Boolean))])}</button>`).join("")}
        ${others.length ? `<details class="more"${convs.length ? "" : " open"}><summary>Also flagged in these {{UNITS}} · ${others.length}</summary><div class="rows">${others.map(y => findingRow(y, true)).join("")}</div></details>` : ""}
      </div>` : ""}
      ${x.why && x.why.length ? `<div><div class="label">Why</div><ul class="why">${x.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
      ${x.evidence && x.evidence.length ? `<div class="ev"><div class="label">Evidence</div>${x.evidence.map(ev => {
        const c = CH[IDX[ev.chapter]], ref = c ? `${c.file}:${ev.line}` : `${ev.chapter}:${ev.line}`;
        return `<blockquote><span>“${esc(ev.quote)}”</span><button class="copy" data-copy="${esc(ref)}">Copy ref</button><span class="ref">${esc(chName(ev.chapter))} L${esc(ev.line)}</span></blockquote>`;
      }).join("")}</div>` : ""}
      ${x.suggestion ? `<div><div class="label">Suggestion</div><p class="sugg">${esc(x.suggestion)}</p></div>` : ""}`;
  }

  function focusConv(c) {
    const fs = (c.findings || []).map(id => FINDING[id]).filter(Boolean);
    const keys = [...new Set(fs.map(x => x.fw))];
    return `<div class="focus-head"><div><div class="kicker">Where they agree · #${c.rank}</div><h2>${esc(c.title)}</h2></div>${X_BTN}</div>
      <div class="meta"><span>${esc(ranges(c.chapters || []))}</span>${c.fix_in && c.fix_in.length ? `<span class="fixin">Fix in ${esc(ranges(c.fix_in))}</span>` : ""}<span>${keys.length} frameworks</span>${fwDots(keys)}${stChip(c)}</div>
      ${miniMap(c.chapters || [], { findings: fs })}
      ${statusBox(c)}
      <p class="lede sm">${esc(c.read)}</p>
      ${c.fix ? `<div><div class="label">Fix</div><p class="sugg">${esc(c.fix)}</p></div>` : ""}
      <div><div class="label">Findings behind it</div><div class="rows">${fs.map(x => findingRow(x, true)).join("")}</div></div>`;
  }

  function focusCluster(k) {
    const keys = [...new Set(k.findings.map(x => x.fw))];
    return `<div class="focus-head"><div><div class="kicker">Overlap · ${k.n} frameworks agree</div><h2>${esc(ranges(k.chapters))}</h2></div>${X_BTN}</div>
      <div class="meta"><span>${k.findings.length} findings</span>${fwDots(keys)}</div>
      ${miniMap(k.chapters, { findings: k.findings })}
      ${k.convs.length ? k.convs.map(id => `<button class="row" data-sel-conv="${esc(id)}"><span class="rank">${CONV[id].rank}</span><span class="row-main"><span class="ttl">${esc(CONV[id].title)}</span><span class="sub">The composer grouped these findings</span></span><span class="chip">${esc(id)}</span></button>`).join("")
        : `<p class="note-box">Not in the composer's list. Either these are separate problems that share {{UNITS}}, or an agreement worth a second look.</p>`}
      <div><div class="label">Findings in this stretch</div><div class="rows">${k.findings.map(x => findingRow(x, true)).join("")}</div></div>`;
  }

  function renderFocus() {
    const el = $("focus"), s2 = state.sel;
    if (!s2) el.innerHTML = `<p class="empty">Click a {{UNIT}}, a timeline entry, or a finding to see it here.</p>`;
    else if (s2.t === "chapter") el.innerHTML = focusChapter(s2.id);
    else if (s2.t === "finding") el.innerHTML = focusFinding(FINDING[s2.id]);
    else if (s2.t === "conv") el.innerHTML = focusConv(CONV[s2.id]);
    else if (s2.t === "cluster") el.innerHTML = focusCluster(s2);
  }
  $("focus").addEventListener("click", e => {
    const t = e.target.closest("[data-clear],[data-copy],[data-sel-finding],[data-sel-chapter],[data-sel-conv],[data-go]"); if (!t) return;
    const d = t.dataset;
    if ("clear" in d) return select(null);
    if (d.copy) return copy(t);
    if (d.selFinding) return select({ t: "finding", id: d.selFinding });
    if (d.selChapter) return select({ t: "chapter", id: d.selChapter });
    if (d.selConv) return select({ t: "conv", id: d.selConv });
    if (d.go) go(d.go);
  });
  tipEvents($("focus"));

  // ---------- right: timeline, priority, agreement ----------
  const isMinor = (f, mk) => f.marks.length > 30 && (mk.status || "ok") === "ok";
  const minorCount = f => f.marks.filter(mk => isMinor(f, mk)).length;

  function timelineHTML(f) {
    const ev = {};
    const add = (ch, e) => { if (IDX[ch] == null) return; (ev[ch] = ev[ch] || []).push(e); };
    f.findings.filter(vis).forEach(x => { const first = x.chapters.map(c => IDX[c]).filter(v => v != null).sort((a, b) => a - b)[0]; if (first != null) add(CH[first].id, { k: "finding", x, o: 0 }); });
    f.marks.forEach(mk => { if (!state.minor && isMinor(f, mk)) return; add(mk.chapter, { k: "mark", mk, o: 1 }); });
    f.spans.forEach(s => { add(s.from, { k: "open", s, o: 2 }); if (s.to != null && s.to !== s.from) add(s.to, { k: "close", s, o: 3 }); });
    const actAt = {}; (D.acts || []).forEach(a => { actAt[a.from] = a; });
    const out = [];
    CH.forEach(c => {
      if (actAt[c.id]) out.push(`<div class="tl-act"><span>${esc(actAt[c.id].label)}</span><span class="mono">${pct(c.p0)}</span></div>`);
      const es = ev[c.id]; if (!es) return;
      es.sort((a, b) => a.o - b.o);
      const on = state.stripCh === c.id;
      const hot = es.some(e => e.k === "finding" || (e.mk && e.mk.status && e.mk.status !== "ok"));
      out.push(`<div class="tl-ch${on ? " on" : ""}${hot ? " hot" : ""}" data-tl-ch="${esc(c.id)}">
        <button class="tl-head" data-sel-chapter="${esc(c.id)}"><span class="mono">${esc(chName(c.id))}</span><span class="tl-name">${c.title === chName(c.id) ? "" : esc(c.title)}</span><span class="pc">${pct(c.p0)}</span></button>
        ${es.map(e => tlEntry(f, e)).join("")}</div>`);
    });
    return out.length ? `<div class="tl">${out.join("")}</div>` : `<p class="empty">Nothing on the map for this framework.</p>`;
  }
  function tlEntry(f, e) {
    if (e.k === "finding") {
      const x = e.x, on = state.sel && state.sel.t === "finding" && state.sel.id === x.id;
      return `<button class="tl-e tl-f${on ? " on" : ""}${isClosed(x) ? " closed" : ""}" data-sel-finding="${esc(x.id)}">${idChip(x)}<span class="tl-t"><span>${esc(x.title)}</span><span class="sub">${esc(ranges(x.chapters))}</span></span><span class="right">${stChip(x)}${sevChip(x)}</span></button>`;
    }
    if (e.k === "mark") {
      const mk = e.mk, st = mk.status || "ok";
      return `<button class="tl-e" data-sel-chapter="${esc(mk.chapter)}">${DIAMOND(stColor(f, st), st === "missing")}<span class="tl-t"><span>${esc(mk.label)}</span>${mk.note ? `<span class="sub">${esc(mk.note)}</span>` : ""}</span><span class="tl-row">${esc(mk.row)}</span>${st !== "ok" ? `<span class="st ${esc(st)}">${esc(st)}</span>` : "<span></span>"}</button>`;
    }
    const s = e.s, st = s.status || "ok", open = e.k === "open";
    return `<button class="tl-e" data-sel-chapter="${esc(open ? s.from : s.to)}"><span class="br" style="color:${stColor(f, st)}">${open ? "[" : "]"}</span><span class="tl-t"><span><span class="muted">${open ? "Opens" : "Closes"}:</span> ${esc(s.label)}</span>${open ? `<span class="sub">${s.to == null ? "still open at the end" : "until " + esc(chName(s.to))}</span>` : ""}</span><span class="tl-row">${esc(s.row)}</span>${open && st !== "ok" ? `<span class="st ${esc(st)}">${esc(st)}</span>` : "<span></span>"}</button>`;
  }

  function priorityHTML(key, highOnly) {
    const order = { high: 0, medium: 1 };
    let list = key ? FWK[key].findings : FW.flatMap(f => f.findings).slice().sort((a, b) => order[a.severity] - order[b.severity] || FW.indexOf(FWK[a.fw]) - FW.indexOf(FWK[b.fw]));
    list = list.filter(vis);
    if (highOnly) list = list.filter(x => x.severity === "high");
    if (highOnly && !list.length) return `<p class="empty">No high findings.</p>`;
    return list.length ? `<div class="rows">${list.map(x => findingRow(x, !key)).join("")}</div>` : `<p class="empty">No findings.</p>`;
  }

  function agreeHTML() {
    const all = D.convergence || [], conv = all.filter(vis);
    if (!all.length) return `<p class="empty">The composer found no shared causes across frameworks.</p>`;
    if (!conv.length) return `<p class="empty">All ${all.length} are closed. Turn on Show closed to see them.</p>`;
    return `<p class="side-note">Findings from different frameworks that the composer traced to one cause. Ranked by how much a fix helps.</p>
      <div class="rows">${conv.map(c => {
        const keys = [...new Set((c.findings || []).map(id => FINDING[id]?.fw).filter(Boolean))];
        const on = state.sel && state.sel.t === "conv" && state.sel.id === c.id;
        return `<button class="row${on ? " on" : ""}${isClosed(c) ? " closed" : ""}" data-sel-conv="${esc(c.id)}"><span class="rank">${CONV[c.id].rank}</span><span class="row-main"><span class="ttl">${esc(c.title)}</span><span class="sub"><span>${esc(ranges(c.chapters || []))}</span><span>${keys.length} frameworks</span></span></span><span class="right">${stChip(c)}${fwDots(keys)}</span></button>`;
      }).join("")}</div>`;
  }

  // overlap explorer
  const flags = (f, id) => f.findings.some(x => sevOk(x) && x.chapters.includes(id));
  function clusters() {
    const fws = visibleFW(), min = state.agreeMin, runs = [];
    let cur = null;
    CH.forEach((c, i) => {
      const n = fws.filter(f => flags(f, c.id)).length;
      if (n >= min) { if (!cur) cur = { ix: [], n: 0 }; cur.ix.push(i); cur.n = Math.max(cur.n, n); }
      else if (c.words < PLACEHOLDER_WORDS && cur) { /* placeholder {{UNIT}}: bridge the run */ }
      else if (cur) { runs.push(cur); cur = null; }
    });
    if (cur) runs.push(cur);
    return runs.map(r => {
      const chapters = r.ix.map(i => CH[i].id);
      const findings = fws.flatMap(f => f.findings.filter(x => sevOk(x) && x.chapters.some(c => chapters.includes(c))));
      const fids = new Set(findings.map(x => x.id));
      const convs = (D.convergence || []).filter(cv => (cv.findings || []).filter(id => fids.has(id)).length >= 2).map(cv => cv.id);
      return { t: "cluster", chapters, findings, n: r.n, convs, key: chapters[0] + "-" + chapters[chapters.length - 1] };
    });
  }
  function pairGrid() {
    const sets = Object.fromEntries(FW.map(f => [f.key, new Set(f.findings.filter(sevOk).flatMap(x => x.chapters))]));
    const val = (a, b) => [...sets[a.key]].filter(c => sets[b.key].has(c)).length;
    let max = 1; FW.forEach(a => FW.forEach(b => { if (a !== b) max = Math.max(max, val(a, b)); }));
    const head = `<tr><th></th>${FW.map(f => `<th class="ph" title="${esc(f.name)}"><span class="dot" style="background:${col(f)}"></span></th>`).join("")}</tr>`;
    const rows = FW.map(a => `<tr><th><span class="dot" style="background:${col(a)}"></span> ${esc(a.name)}</th>${FW.map(b => {
      if (a === b) return `<td><span class="self">·</span></td>`;
      const n = val(a, b), lvl = n === 0 ? 0 : Math.min(4, Math.ceil(n / max * 4));
      return `<td><button data-pair="${esc(a.key)},${esc(b.key)}" style="background:${lvl ? `var(--heat${lvl})` : "var(--sunken)"};${lvl >= 3 ? "color:#fff" : ""}" title="${esc(a.name)} and ${esc(b.name)} both flag ${n} {{UNITS}}">${n || ""}</button></td>`;
    }).join("")}</tr>`).join("");
    return `<table class="pairs">${head}${rows}</table>`;
  }
  function exploreHTML() {
    const list = clusters(), covered = list.filter(k => k.convs.length).length;
    return `<div class="ex">
      <p class="side-note">Pick which frameworks count and how many must agree. The map's lanes and overlap strip follow these settings.</p>
      <div class="chips">${FW.map(f => `<button class="fchip${state.hidden.has(f.key) ? " off" : ""}" data-fwchip="${esc(f.key)}" aria-pressed="${!state.hidden.has(f.key)}"><span class="dot" style="background:${col(f)}"></span>${esc(f.name)}</button>`).join("")}</div>
      <div class="ex-row"><span class="label">At least</span><span class="seg">${[2, 3, 4].map(n => `<button data-min="${n}" aria-pressed="${state.agreeMin === n}">${n}${n === 4 ? "+" : ""}</button>`).join("")}</span><span class="label">agree</span>
        <span class="seg"><button data-sev="all" aria-pressed="${state.sev === "all"}">All findings</button><button data-sev="high" aria-pressed="${state.sev === "high"}">High only</button></span>
        <button class="linkish" data-reset>Reset</button></div>
      <div><div class="label">Which frameworks agree most</div><p class="side-note">{{Units}} both frameworks flag. Click a cell to compare just that pair.</p><div class="pairs-wrap">${pairGrid()}</div></div>
      <div><div class="label">Stretches where ${state.agreeMin}+ agree · ${list.length}${list.length ? ` · ${covered} in the composer's list` : ""}</div>
      ${list.length ? `<div class="rows">${list.map(k => {
        const on = state.sel && state.sel.t === "cluster" && state.sel.key === k.key;
        return `<button class="row${on ? " on" : ""}" data-sel-cluster="${esc(k.key)}"><span class="cnt" title="${k.n} frameworks">${k.n}</span><span class="row-main"><span class="ttl">${esc(ranges(k.chapters))}</span><span class="sub"><span>${k.findings.length} findings</span>${fwDots([...new Set(k.findings.map(x => x.fw))])}</span></span>${k.convs.length ? `<span class="chip">${esc(k.convs.join(", "))}</span>` : `<span class="chip warn-chip">not covered</span>`}</button>`;
      }).join("")}</div>` : `<p class="empty">No {{UNITS}} where ${state.agreeMin} of these frameworks agree.</p>`}</div>
    </div>`;
  }

  function sideTabs() {
    return state.view === "all"
      ? [["agree", "Where they agree"], ["explore", "Explore overlap"], ["timeline", "Timeline"], ["fix", "Fix first"], ["priority", "By priority"]]
      : [["timeline", "Timeline"], ["fix", "Fix first"], ["priority", "By priority"]];
  }
  function renderSide(keepScroll) {
    const el = $("side"), old = $("side-body"), sc = old ? old.scrollTop : 0;
    const tabs = sideTabs();
    let mode = state.view === "all" ? state.sideAll : state.sideFw;
    if (!tabs.some(t => t[0] === mode)) mode = tabs[0][0];
    const tlKey = state.view === "all" ? state.tlfw : state.view;
    const prKey = state.view === "all" ? state.prfw : state.view;
    let tools = "", body = "";
    if (mode === "timeline" || mode === "priority" || mode === "fix") {
      const cur = mode === "timeline" ? tlKey : prKey;
      const opts = (mode !== "timeline" && state.view === "all" ? [`<option value="" ${!cur ? "selected" : ""}>All frameworks</option>`] : [])
        .concat(FW.map(f => `<option value="${esc(f.key)}" ${f.key === cur ? "selected" : ""}>${esc(f.name)}</option>`));
      tools = `<label class="pick">${cur ? `<span class="dot" style="background:${col(FWK[cur])}"></span>` : ""}<select id="fw-pick" aria-label="Framework">${opts.join("")}</select></label>`;
      if (mode === "timeline") {
        const n = minorCount(FWK[tlKey]);
        if (n) tools += `<label class="check"><input type="checkbox" id="minor" ${state.minor ? "checked" : ""}> Progress marks (${n})</label>`;
        body = timelineHTML(FWK[tlKey]);
      } else body = priorityHTML(prKey, mode === "fix");
    } else body = mode === "agree" ? agreeHTML() : exploreHTML();
    el.innerHTML = `<div class="side-head"><span class="seg">${tabs.map(([k, l]) => `<button data-side="${k}" aria-pressed="${k === mode}">${l}</button>`).join("")}</span><div class="side-tools">${tools}</div></div><div class="side-body" id="side-body">${body}</div>`;
    if (keepScroll) $("side-body").scrollTop = sc;
  }
  $("side").addEventListener("click", e => {
    const t = e.target.closest("[data-side],[data-sel-finding],[data-sel-chapter],[data-sel-conv],[data-sel-cluster],[data-fwchip],[data-min],[data-sev],[data-pair],[data-reset]");
    if (!t) return;
    const d = t.dataset;
    if (d.side) { if (state.view === "all") state.sideAll = d.side; else state.sideFw = d.side; renderSide(); return; }
    if (d.selFinding) return select({ t: "finding", id: d.selFinding }, true);
    if (d.selChapter) return select({ t: "chapter", id: d.selChapter }, true);
    if (d.selConv) return select({ t: "conv", id: d.selConv }, true);
    if (d.selCluster) { const k = clusters().find(k => k.key === d.selCluster); if (k) select(k, true); return; }
    if (d.fwchip) return toggleFw(d.fwchip);
    if (d.min) { state.agreeMin = +d.min; drawMap(); renderSide(true); return; }
    if (d.sev) { state.sev = d.sev; renderControls(); drawMap(); renderSide(true); renderFocus(); return; }
    if (d.pair) { const [a, b] = d.pair.split(","); state.hidden = new Set(FW.map(f => f.key).filter(k => k !== a && k !== b)); state.agreeMin = 2; drawMap(); renderSide(true); renderFocus(); return; }
    if ("reset" in d) { state.hidden.clear(); state.agreeMin = 2; drawMap(); renderSide(true); renderFocus(); }
  });
  $("side").addEventListener("change", e => {
    if (e.target.id === "fw-pick") {
      const v = e.target.value, mode = state.view === "all" ? state.sideAll : state.sideFw;
      if (state.view !== "all" && v) { go(v); return; }
      if (mode === "timeline") state.tlfw = v; else state.prfw = v;
      renderSide();
    }
    if (e.target.id === "minor") { state.minor = e.target.checked; renderSide(true); }
  });
  tipEvents($("side"));

  function renderAll() { renderTabs(); renderControls(); drawMap(); renderStrip(); renderFocus(); renderSide(); }
  const hashCh = parseHash().ch;
  setSel(hashCh && IDX[hashCh] != null ? { t: "chapter", id: hashCh } : defaultSel());
  renderAll();
  if (hashCh && IDX[hashCh] != null) requestAnimationFrame(() => { scrollSideTo(state.sel); $("strip").scrollIntoView({ block: "start" }); });
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { drawMap(); renderFocus(); stripHeight(); }, 120); });
  if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", drawMap);
})();
</script>
